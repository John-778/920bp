<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Page not found · Digital Bus Pass</title>
    <meta name="description" content="The page you were looking for does not exist." />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#6200ea" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-left)) 16px max(16px, env(safe-area-inset-bottom));
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        text-align: center;
      }
      main { width: 100%; max-width: 420px; }
      .code {
        margin: 0;
        font-size: clamp(56px, 22vw, 96px);
        font-weight: 800;
        line-height: 1;
        color: #7a28ff;
      }
      h1 { margin: 8px 0 12px; font-size: 22px; }
      p { margin: 0 auto 28px; max-width: 36ch; color: #9b9b9b; font-size: 15px; line-height: 1.5; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; }
      a.btn, button.btn {
        flex: 1 1 140px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 12px 20px;
        border: 1px solid transparent;
        border-radius: 999px;
        background: #6200ea;
        color: #fff;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
      a.btn:hover, button.btn:hover { background: #7a28ff; }
      .btn--secondary { background: transparent; border-color: #444; }
      .btn--secondary:hover { background: #262626; }
      :focus-visible { outline: 3px solid #1fff1f; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>That page does not exist</h1>
      <p>The page you were looking for could not be found. It may have been renamed or removed.</p>
      <div class="actions">
        <a class="btn" href="/">Go to my pass</a>
        <button class="btn btn--secondary" type="button" onclick="history.back()">Go back</button>
      </div>
    </main>
  </body>
</html>
