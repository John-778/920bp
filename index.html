<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>My Pass · Digital Bus Pass</title>
    <meta
      name="description"
      content="Keep your employee bus pass details - route, stops, validity dates and timings - on your own phone, ready to show offline."
    />
    <meta name="theme-color" content="#6200ea" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="/" />

    <!-- Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Digital Bus Pass" />
    <meta property="og:title" content="Digital Bus Pass" />
    <meta
      property="og:description"
      content="Keep your employee bus pass details on your own phone, ready to show offline."
    />
    <meta property="og:image" content="icons/og-image.png" />
    <meta property="og:url" content="/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Icons / install -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bus Pass" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <style>
      /* Painted before the bundle arrives so the first frame is not white. */
      html { background: #000; }
      #boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        min-height: 70vh;
        color: #9b9b9b;
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      }
      #boot .ring {
        width: 34px;
        height: 34px;
        border: 3px solid #333;
        border-top-color: #6200ea;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot .ring { animation: none; } }
      html[data-booted] #boot { display: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot">
        <div class="ring" aria-hidden="true"></div>
        <p>Loading your pass&hellip;</p>
      </div>
    </div>

    <noscript>
      <div style="padding: 24px; color: #fff; font-family: Arial, sans-serif">
        <h1 style="font-size: 20px">JavaScript is required</h1>
        <p style="color: #9b9b9b">
          This app stores and displays your bus pass on your own device, which needs JavaScript
          turned on. Please enable it and reload the page.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
